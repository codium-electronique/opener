CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_GPIO=y
CONFIG_DECTNRP_DRIVER_SCHEDULED_API=y
CONFIG_DECTNRP_DRIVER_MOCK=y
CONFIG_DECTNRP_SPINEL=y
CONFIG_DECTNRP_SPINEL_TRANSPORT_SPI=y
CONFIG_DECTNRP_SPINEL_SPI_TX_TIMEOUT_MS=100
# 1 us kernel tick. Only this suite needs it: it checks BUSY/IRQ edges and the reply hold at
# microsecond scale (hundreds of us), which a coarser tick would round away. The other Spinel
# suites run on the default tick and do not measure sub-millisecond timing.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000000
CONFIG_DECTNRP_SPINEL_SPI_REPLY_WAIT_US=2000
